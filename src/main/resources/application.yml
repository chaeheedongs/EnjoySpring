spring:
  application:
    name: Spring

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB     # 파일 크기
      max-request-size: 10MB  # 요청 크기

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: false

project:
  switch:
    interceptor: false
    filter: false
